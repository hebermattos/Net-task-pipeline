name: examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet-examples:
    name: Run .NET examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: SimpleExample
            expected: "Pipeline success: True"
          - example: AdvancedExample
            expected: "External confirmation: EXT-OK-123"
          - example: BranchingExample
            expected: "Discount applied: True"
          - example: DependencyInjectionExample
            expected: "Notification sent: True"
          - example: HttpExample
            expected: "Pipeline success: True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run and validate example
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          output=$(dotnet run --project "examples/${{ matrix.example }}/${{ matrix.example }}.csproj" --configuration Release)
          printf '%s\n' "$output"
          grep -Fq "${{ matrix.expected }}" <<< "$output"

  rabbitmq-rpc-example:
    name: Run RabbitMQ RPC example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start and validate example
        working-directory: examples/RpcDockerExample
        run: docker compose up --build --abort-on-container-exit --exit-code-from main-app
      - name: Show container logs
        if: always()
        working-directory: examples/RpcDockerExample
        run: docker compose logs --no-color
      - name: Stop example
        if: always()
        working-directory: examples/RpcDockerExample
        run: docker compose down --volumes --remove-orphans
