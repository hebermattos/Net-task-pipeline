name: publish-nuget

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-tests:
    uses: ./.github/workflows/tests.yml

  examples:
    uses: ./.github/workflows/examples.yml

  publish:
    needs: [build-and-tests, examples]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve and validate package version
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a valid package version such as v1.2.3."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore src/NetTaskPipeline/NetTaskPipeline.csproj
      - name: Pack release
        run: dotnet pack src/NetTaskPipeline/NetTaskPipeline.csproj --configuration Release --no-restore --output artifacts/packages -p:PackageVersion=$PACKAGE_VERSION
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
