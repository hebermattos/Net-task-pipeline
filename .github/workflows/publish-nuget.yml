name: publish-nuget

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve and validate package version
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a valid package version such as v1.2.3."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore src/NetTaskPipeline/NetTaskPipeline.csproj
      - name: Pack release
        run: dotnet pack src/NetTaskPipeline/NetTaskPipeline.csproj --configuration Release --no-restore --output artifacts/packages -p:PackageVersion=$PACKAGE_VERSION
      - name: Smoke test packed NuGet package
        shell: bash
        run: |
          package_path=$(find artifacts/packages -maxdepth 1 -name "NetTaskPipeline.$PACKAGE_VERSION.nupkg" -print -quit)
          test -n "$package_path"
          mkdir -p artifacts/smoke
          dotnet new console --framework net10.0 --output artifacts/smoke/app
          dotnet nuget add source "$(pwd)/artifacts/packages" --name local-package
          dotnet add artifacts/smoke/app/app.csproj package NetTaskPipeline --version "$PACKAGE_VERSION" --source "$(pwd)/artifacts/packages"
          cat > artifacts/smoke/app/Program.cs <<'EOF'
          using NetTaskPipeline;

          var result = await new TaskPipeline()
              .AddTask("Smoke test", _ => Task.CompletedTask)
              .ExecuteAsync();

          if (!result.Success)
              throw new InvalidOperationException("Package smoke test failed.");
          EOF
          dotnet run --project artifacts/smoke/app/app.csproj --configuration Release

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: Publish symbols to NuGet
        run: dotnet nuget push "artifacts/packages/*.snupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
