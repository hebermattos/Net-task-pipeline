services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: net-task-pipeline-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

  consumer:
    build:
      context: ../..
      dockerfile: examples/RpcDockerExample/Consumer/Dockerfile
    environment:
      NET_TASK_PIPELINE_RPC_URI: amqp://guest:guest@rabbitmq:5672/
      RPC_CONSUMER_READY_FILE: /tmp/net-task-pipeline-rpc-consumer-ready
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/net-task-pipeline-rpc-consumer-ready"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  main-app:
    build:
      context: ../..
      dockerfile: examples/RpcDockerExample/MainApp/Dockerfile
    environment:
      NET_TASK_PIPELINE_RPC_URI: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      consumer:
        condition: service_healthy
